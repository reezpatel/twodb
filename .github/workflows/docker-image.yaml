name: Docker images

# Old monolith images (twodb, twodb-runner) are no longer published. Per-app
# images release independently from `<slug>/vX.Y.Z` tags — see
# release-app.yml. This workflow now just makes sure every app still builds
# as a Docker image on main pushes, so a broken Dockerfile/app build is
# caught before someone tags a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - twodb
          - tworoute
          - twomail
          - twoday
          - twocontacts
          - twochat
          - twodrive
          - artisan
          - dispatch
          - tworing
          - garden
          - twothing
          - twoloop
          - membrain
          - paintress
          - twopin
          - twodoo
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Build app image (no push)
        uses: docker/build-push-action@v6 # zizmor: ignore[unpinned-uses]
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          build-args: |
            APP_PKG=@twodb/app-${{ matrix.app }}
          push: false
          tags: twodb/${{ matrix.app }}:ci
          cache-from: type=gha,scope=app-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.app }}
