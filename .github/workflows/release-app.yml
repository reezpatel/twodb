name: Release app image

# Per-app Docker image releases. The old monolith's single `v*` tag is gone —
# every app now releases independently with its own tag:
#
#   git tag tworoute/v0.2.0 && git push origin tworoute/v0.2.0
#
# builds ghcr.io/<owner>/app-tworoute:0.2.0 (+ :latest). Apps that didn't
# change simply don't get a new tag — nothing forces version lockstep across
# the ecosystem. Skipping a version for one app is fine.
#
# The app image is the same `deploy/docker/app.Dockerfile` TwoDB's
# orchestrator builds locally at install time; these published images are
# what a future multi-host / registry-based install path would pull.

on:
  push:
    tags:
      - "*/v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Parse app slug + version from tag
        id: tag
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"            # e.g. "tworoute/v0.2.0"
          slug="${ref%%/*}"                   # "tworoute"
          version="${ref#*/v}"                # "0.2.0"
          case "$slug" in
            twodb|tworoute|twomail|twoday|twocontacts|twochat|twodrive|artisan|dispatch|tworing|garden|twothing|twoloop|membrain|paintress|twopin|twodoo) ;;
            *) echo "::error::unknown app slug '$slug' in tag '$ref' — must be one of the catalog slugs in apps/twodb/src/orchestrator/catalog.ts"; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$ref' must be '<slug>/v<major>.<minor>.<patch>'"
            exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pkg=@twodb/app-$slug" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3 # zizmor: ignore[unpinned-uses]
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5 # zizmor: ignore[unpinned-uses]
        with:
          images: ghcr.io/${{ github.repository_owner }}/app-${{ steps.tag.outputs.slug }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6 # zizmor: ignore[unpinned-uses]
        with:
          context: .
          file: deploy/docker/app.Dockerfile
          build-args: |
            APP_PKG=${{ steps.tag.outputs.pkg }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app-${{ steps.tag.outputs.slug }}
          cache-to: type=gha,mode=max,scope=app-${{ steps.tag.outputs.slug }}
