name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # zizmor: ignore[unpinned-uses]

      - name: Set up Node
        uses: actions/setup-node@v4 # zizmor: ignore[unpinned-uses]
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugins
        run: |
          for dir in plugins/auth plugins/workspace plugins/llm plugins/node plugins/code plugins/llm-adapters/*; do
            (cd "$dir" && node build.mjs)
          done

      - name: Build web
        working-directory: apps/web
        run: npx vite build

      - name: Build api
        working-directory: apps/api
        run: node build.mjs

      - name: Vendor browser deps
        run: node scripts/vendor-deps.mjs
