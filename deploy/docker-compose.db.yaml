# Local-only data services for twodb (Postgres + Memgraph + S3-compatible RustFS).
# Run with:  docker compose -f docker-compose.db.yaml up -d
# Tear down: docker compose -f docker-compose.db.yaml down

name: twodb-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: twodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twodb}
      POSTGRES_USER: ${POSTGRES_USER:-twodb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twodb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - twodb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  memgraph:
    image: memgraph/memgraph:latest
    container_name: twodb-memgraph
    restart: unless-stopped
    command: ["--data-directory=/var/lib/memgraph/data"]
    environment:
      MEMGRAPH_FLAGS: "--also-log-to-stderr"
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    networks:
      - twodb-net
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/7687 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  s3:
    # RustFS (S3-compatible). MinIO is deprecated here — see docker-compose.full.yaml for the full stack.
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.0-alpha.89}
    container_name: twodb-s3
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-twodb}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-twodb-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    networks:
      - twodb-net

  s3-init:
    image: amazon/aws-cli:2.22.0
    container_name: twodb-s3-init
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-twodb}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-twodb-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-twodb}
    entrypoint:
      - sh
      - -c
      - |
        for i in $$(seq 1 60); do
          if aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1 \
             || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$S3_BUCKET" >/dev/null 2>&1; then exit 0; fi
          sleep 2
        done
        exit 1
    networks:
      - twodb-net
    restart: "no"

volumes:
  postgres-data:
    name: twodb-postgres-data
  memgraph-data:
    name: twodb-memgraph-data
  s3-data:
    name: twodb-s3-data

networks:
  twodb-net:
    name: twodb-net
    driver: bridge
