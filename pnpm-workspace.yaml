packages:
  - "apps/*"
  - "apps/*/webapp"
  - "core/*"
  - "blocks"
  - "editor"
  - "tools/*"

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  "@google/genai": false
  "@prisma/client": false
  better-sqlite3: true
  core-js: false
  esbuild: true
  node-pty: true
  protobufjs: false
minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
