packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
  - "plugins/identity/view"
  - "plugins/agent-providers/*"
  - "stack/*"
  - "libs/*"

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - pg-protocol@1.16.0
  - pg@8.23.0
