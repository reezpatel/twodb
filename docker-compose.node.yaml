# Node agent (twodb-node) container.
#
# Standalone (default): the agent connects OUTBOUND to a controller running on
# the docker host via host.docker.internal (same pattern as docker-compose.yaml).
#
#   docker compose -f docker-compose.node.yaml up -d
#
# Alongside the full stack (docker-compose.all.yaml): the controller container
# is named twodb-server on the twodb-net network, so set in .env:
#
#   TWO_DB_CONTROLLER_URL=http://twodb-server:3001
#
# and uncomment the two `networks` blocks below before starting this compose.

name: twodb-node

services:
  node-agent:
    build:
      context: .
      dockerfile: apps/node/Dockerfile
    image: twodb-node:local
    container_name: twodb-node-agent
    restart: unless-stopped
    # Host networking: the agent shares the host stack so it can reach a
    # controller running on the host (e.g. `pnpm dev` in apps/api). The
    # default bridge is often blocked by host firewalls for host-process
    # ports. For remote controllers, drop network_mode and set
    # TWO_DB_CONTROLLER_URL to the controller's address.
    network_mode: host
    environment:
      TWO_DB_CONTROLLER_URL: ${TWO_DB_CONTROLLER_URL:-http://host.docker.internal:3001}
      TWO_DB_CONTROLLER_WS_PATH: ${TWO_DB_CONTROLLER_WS_PATH:-/api/v1/io.twodb.node/nodes/ws}
      TWO_DB_NODE_SECRET: ${TWO_DB_NODE_SECRET:?set TWO_DB_NODE_SECRET in .env — create it in the nodes UI (see .env.example)}
      TWO_DB_HEARTBEAT_MS: ${TWO_DB_HEARTBEAT_MS:-10000}
      TWO_DB_ROOT_DIR: ${TWO_DB_ROOT_DIR:-/host}
    volumes:
      # Jail root for the agent's file/command APIs: the host filesystem,
      # mounted at /host (TWO_DB_ROOT_DIR=/host).
      - /:/host
