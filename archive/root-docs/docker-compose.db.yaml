# Local-only data services for twodb (Postgres + Memgraph + S3-compatible MinIO).
# Run with:  docker compose -f docker-compose.db.yaml up -d
# Tear down: docker compose -f docker-compose.db.yaml down

name: twodb-db

services:
  postgres:
    image: postgres:17-alpine
    container_name: twodb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twodb}
      POSTGRES_USER: ${POSTGRES_USER:-twodb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twodb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - twodb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  memgraph:
    image: memgraph/memgraph:latest
    container_name: twodb-memgraph
    restart: unless-stopped
    command: ["--data-directory=/var/lib/memgraph/data"]
    environment:
      MEMGRAPH_FLAGS: "--also-log-to-stderr"
    ports:
      - "${MEMGRAPH_BOLT_PORT:-7687}:7687"
    volumes:
      - memgraph-data:/var/lib/memgraph
    networks:
      - twodb-net
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/7687 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  s3:
    image: minio/minio:latest
    container_name: twodb-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-twodb}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-twodb-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    networks:
      - twodb-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  s3-init:
    image: minio/mc:latest
    container_name: twodb-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-twodb}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-twodb-secret}
      S3_BUCKET: ${S3_BUCKET:-twodb}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://s3:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY};
      mc mb --ignore-existing local/$${S3_BUCKET};
      "
    networks:
      - twodb-net
    restart: "no"

volumes:
  postgres-data:
    name: twodb-postgres-data
  memgraph-data:
    name: twodb-memgraph-data
  s3-data:
    name: twodb-s3-data

networks:
  twodb-net:
    name: twodb-net
    driver: bridge
