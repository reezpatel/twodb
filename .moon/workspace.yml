  app-twopager-webapp: "apps/twopager/webapp"
  app-twopin: "apps/twopin"
  app-twopin-webapp: "apps/twopin/webapp"
  app-twoplan: "apps/twoplan"
  app-twoplan-webapp: "apps/twoplan/webapp"
  app-tworing: "apps/tworing"
  app-tworing-webapp: "apps/tworing/webapp"
  app-tworoute: "apps/tworoute"
  app-tworoute-webapp: "apps/tworoute/webapp"
