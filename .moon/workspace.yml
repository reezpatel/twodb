  twodb-core: "core/twodb-core"
  twodb-shared-frontend: "core/twodb-shared-frontend"
  cli: "tools/cli"
  blocks: "blocks"
  editor: "editor"

vcs:
  client: 'git'
  defaultBranch: 'main'
