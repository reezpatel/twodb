$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Explicit ids: many apps share a `webapp` folder name, so globs would collide.
# Add new projects here (tools/scaffold-app.mjs does not do it yet).
projects:
  app-artisan: "apps/artisan"
  app-artisan-webapp: "apps/artisan/webapp"
  app-dispatch: "apps/dispatch"
  app-dispatch-webapp: "apps/dispatch/webapp"
  app-fincal: "apps/fincal"
  app-fincal-webapp: "apps/fincal/webapp"
  app-garden: "apps/garden"
  app-garden-webapp: "apps/garden/webapp"
  app-membrain: "apps/membrain"
  app-paintress: "apps/paintress"
  app-paintress-webapp: "apps/paintress/webapp"
  app-toolkit: "apps/toolkit"
  app-toolkit-webapp: "apps/toolkit/webapp"
  two-runner: "apps/two-runner"
  app-twochat: "apps/twochat"
  app-twochat-webapp: "apps/twochat/webapp"
  app-twocontacts: "apps/twocontacts"
  app-twocontacts-webapp: "apps/twocontacts/webapp"
  app-twoday: "apps/twoday"
  app-twoday-webapp: "apps/twoday/webapp"
  app-twodb: "apps/twodb"
  app-twodb-webapp: "apps/twodb/webapp"
  app-twodoo: "apps/twodoo"
  app-twodoo-webapp: "apps/twodoo/webapp"
  app-twodrive: "apps/twodrive"
  app-twodrive-webapp: "apps/twodrive/webapp"
  app-twoloop: "apps/twoloop"
