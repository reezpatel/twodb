<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Identity -->
    <title>twodb — A second brain for people who are not technical</title>
    <meta
      name="description"
      content="twodb is a second brain for people who are not technical — notes, calendar, meetings, chat, automations, and AI-built tools in one calm place."
    />
    <meta name="application-name" content="twodb" />
    <meta name="author" content="twodb" />
    <link rel="canonical" href="https://app.twodb.io/" />
    <meta name="keywords" content="second brain, notes, knowledge base, meetings, transcription, automation, AI assistant, calendar, chat" />

    <!-- Icons & PWA -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="twodb" />

    <!-- Theme: day ground by default, editor zinc for dark system preference -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181B" />
    <meta name="msapplication-TileColor" content="#0A2BFF" />
    <meta name="msapplication-TileImage" content="/brand/android-chrome-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.twodb.io/" />
    <meta property="og:site_name" content="twodb" />
    <meta property="og:title" content="twodb — A second brain for people who are not technical" />

      property="og:description"
      content="Notes, calendar, meetings, chat, automations, and AI-built tools — one calm second brain that acts on your data, no technical skills required."
    />
    <meta property="og:image" content="https://app.twodb.io/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The twodb logo — a white numeral 2 on a blue gradient — with the tagline: A second brain for people who are not technical."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="twodb — A second brain for people who are not technical" />

      name="twitter:description"

      name="twitter:image:alt"
      content="The twodb logo — a white numeral 2 on a blue gradient — with the tagline: A second brain for people who are not technical."
    />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "name": "twodb",
