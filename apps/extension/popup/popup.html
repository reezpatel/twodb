<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 300px; margin: 0; padding: 12px; background: #0a0a0a; color: #fafafa; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; font-size: 11px; color: #a3a3a3; margin: 8px 0 3px; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
        border: 1px solid #ffffff26; background: #171717; color: #fafafa; font-size: 12px; }
      .row { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; }
      button { cursor: pointer; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600;
        background: #fafafa; color: #0a0a0a; }
      button:hover { background: #e5e5e5; }
      .status { margin-top: 10px; font-size: 12px; padding: 8px; border-radius: 6px; background: #171717; }
      .ok { color: #4ade80; } .err { color: #f87171; }
      a { color: #7dd3fc; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>twodb Meeting Recorder</h1>
    <label for="server">Server URL</label>
    <input id="server" type="text" placeholder="http://localhost:3001" />
    <label for="key">API key (org)</label>
    <input id="key" type="password" placeholder="twodb_…" />
    <div class="row">
      <input id="screen" type="checkbox" checked />
      <span>capture screen track by default</span>
    </div>
    <div class="row">
      <button id="save">Save</button>
      <button id="test">Test</button>
    </div>
    <div id="status" class="status">—</div>
    <div class="row" style="justify-content: space-between">
      <a href="#" id="keys">create API key →</a>
    </div>
    <div class="row">
      <button id="record" style="background:#ef4444;color:#fff">● Record this tab</button>
    </div>
    <p style="font-size:10px;color:#737373;margin:8px 0 0">
      Records the current tab (Meet/Teams). Also: right-click page → "Record this meeting", or Ctrl+Shift+R.
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
