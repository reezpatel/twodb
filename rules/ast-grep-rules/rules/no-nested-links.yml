id: no-nested-links
language: TSX
message: "Nested <a> tags are invalid HTML and cause unexpected behavior"
severity: error
note: |
  HTML does not allow anchor tags nested inside other anchor tags.
  This causes rendering issues and unpredictable click behavior.
# Project override: the built-in flags ANY jsx element that merely contains
# an <a> descendant (e.g. <section> wrapping a link). The matched element must
# itself be an <a> with a nested <a> inside it.
rule:
  all:
    - kind: jsx_element
    - has:
        field: open_tag
        kind: jsx_opening_element
        has:
          field: name
          regex: "^a$"
    - has:
        kind: jsx_element
        stopBy: end
        has:
          field: open_tag
          kind: jsx_opening_element
          has:
            field: name
            regex: "^a$"
